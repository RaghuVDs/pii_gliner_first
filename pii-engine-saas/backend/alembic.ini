# Alembic Configuration File
# ----------------------------------------------------------
# PII Engine SaaS -- Database Migrations
# ----------------------------------------------------------

[alembic]
# Path to migration scripts.
script_location = alembic

# Template used to generate migration files.
# file_template = %%(rev)s_%%(slug)s

# sys.path prepended with this so that the 'app' package is importable.
prepend_sys_path = .

# Timezone for migration file timestamps.
# timezone =

# Max length of characters to apply to the "slug" field.
# truncate_slug_length = 40

# The default value of 'sqlalchemy.url' is overridden at runtime by
# alembic/env.py using the DATABASE_URL environment variable.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Uncomment to run black after autogenerate:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
