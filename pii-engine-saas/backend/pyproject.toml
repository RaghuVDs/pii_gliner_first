[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-engine-saas"
version = "1.0.0"
description = "Enterprise SaaS platform for PII detection and management"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
authors = [
    { name = "PII Engine Team" },
]

dependencies = [
    # ── Web Framework ────────────────────────────────────────────────
    "fastapi[all]>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",

    # ── Database / ORM ───────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.25,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",

    # ── MongoDB ──────────────────────────────────────────────────────
    "motor>=3.3.0,<4.0.0",
    "pymongo>=4.6.0,<5.0.0",

    # ── Elasticsearch ────────────────────────────────────────────────
    "elasticsearch[async]>=8.12.0,<9.0.0",

    # ── Redis ────────────────────────────────────────────────────────
    "redis[hiredis]>=5.0.0,<6.0.0",

    # ── Object Storage ───────────────────────────────────────────────
    "minio>=7.2.0,<8.0.0",

    # ── Settings & Validation ────────────────────────────────────────
    "pydantic-settings>=2.1.0,<3.0.0",

    # ── Security ─────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.1.0,<5.0.0",

    # ── Task Queue ───────────────────────────────────────────────────
    "celery[redis]>=5.3.0,<6.0.0",

    # ── File Upload ──────────────────────────────────────────────────
    "python-multipart>=0.0.6,<1.0.0",

    # ── ML / NLP ─────────────────────────────────────────────────────
    "gliner>=0.2.0",
    "torch>=2.1.0",
    "transformers>=4.37.0,<5.0.0",

    # ── Utilities ────────────────────────────────────────────────────
    "pyyaml>=6.0.1,<7.0.0",
    "numpy>=1.26.0,<2.0.0",
    "regex>=2023.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["."]

# ── Ruff ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy ─────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
